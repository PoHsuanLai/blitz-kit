[package]
name = "blitz-kit"
description = "Portable Blitz repairs and helpers: hover sync, local net provider, shared fonts, adapter choice, painted rects, pixel snap, the scroll engine."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
blitz-dom = { workspace = true }
blitz-traits = { workspace = true }
parley = { workspace = true }
# `scroll::keys` names the keys a scroll responds to.
keyboard-types = { workspace = true }
# `net::LocalNet` reads files on the caller's blocking pool.
tokio = { workspace = true }
# Feature `adapter`: the ranking of GPU adapters, and `AdapterPref` (a shell's serialized setting).
wgpu = { workspace = true, optional = true }
serde = { workspace = true, optional = true }

[features]
default = []
adapter = ["dep:wgpu", "dep:serde"]
# `scroll::config`'s settings read and write as a settings file's `[scroll]` table.
settings = ["dep:serde"]

[lints]
workspace = true

[[test]]
name = "adapter"
required-features = ["adapter"]
